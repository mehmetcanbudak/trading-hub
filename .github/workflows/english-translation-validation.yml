name: English translation validation

on:
  push:
    branches:
      - feat/english-localization
      - translation/english-documentation-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-shared-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared solution on Windows
        run: dotnet build TradingHub.slnx --configuration Release
      - name: Run shared regression tests on Windows
        run: dotnet test tests/TradingHub.Tests --configuration Release --no-restore
      - name: Verify English source and documentation on Windows
        run: python tools/check_english_translation.py

  macos-build-and-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build TradingHub.slnx --configuration Release
      - name: Run regression tests
        run: dotnet test tests/TradingHub.Tests --configuration Release --no-restore
      - name: Verify English documentation, source and compatibility review
        run: python3 tools/check_english_translation.py
      - name: Render and check isolated English UI scenarios
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/tradinghub-english.XXXXXX")"
          export TRADINGHUB_DATA_DIR="$fixture/data"
          export TRADINGHUB_STRATEGIES_DIR="$fixture/strategies"
          export TRADINGHUB_INDICATORS_DIR="$fixture/indicators"
          export TRADINGHUB_KEYCHAIN_FILE="$fixture/fake-keychain.json"
          export TRADINGHUB_SLEEP_GUARD=off
          dotnet run --configuration Release --project tools/TradingHub.UiSnapshot -- \
            "$RUNNER_TEMP/tradinghub-english-ui" 2 \
            trading settings connections data strategies accounts live english \
            panel footprint mercado conexiones data+rithmic data+import trading+strategy theme
      - name: Upload English UI and report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinghub-english-ui
          path: ${{ runner.temp }}/tradinghub-english-ui/
          if-no-files-found: warn
          retention-days: 7
