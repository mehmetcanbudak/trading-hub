name: English translation validation

on:
  push:
    branches:
      - memoshi
      - 'sync/upstream-*'
  pull_request:
    branches:
      - memoshi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TRADINGHUB_SLEEP_GUARD: 'off'

jobs:
  windows-shared-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Isolate all application stores
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'tradinghub-validation'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $paths = @{
            TRADINGHUB_DATA_DIR = 'data'
            TRADINGHUB_STRATEGIES_DIR = 'strategies'
            TRADINGHUB_INDICATORS_DIR = 'indicators'
            TRADINGHUB_BACKTESTS_DIR = 'backtests'
            TRADINGHUB_LIVE_DIR = 'live'
            TRADINGHUB_KEYCHAIN_FILE = 'fake-keychain.json'
          }
          foreach ($name in $paths.Keys) {
            "$name=$(Join-Path $fixture $paths[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Test upstream tracker without network or notifications
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Build complete solution on Windows
        run: dotnet build TradingHub.slnx --configuration Release
      - name: Run compatibility, safety and native Windows regression tests
        env:
          # Unique test-only entries are removed by the native credential fixture.
          TRADINGHUB_TEST_CREDMAN: '1'
          # Hosted-only: request and immediately release a thread execution assertion; no power-plan or lid changes.
          TRADINGHUB_TEST_POWER: '1'
        run: dotnet test tests/TradingHub.Tests --configuration Release --no-restore --no-build --logger "trx;LogFileName=windows.trx" --results-directory "${{ runner.temp }}/tradinghub-results"
      - name: Verify English source and documentation
        run: python tools/check_english_translation.py
      - name: Verify every upstream translation and template
        shell: pwsh
        run: |
          foreach ($language in 'es', 'zh-CN') {
            dotnet tools/TradingHub.I18n/bin/Release/net10.0/TradingHub.I18n.dll coverage tools/TradingHub.I18n/provenance.json "src/TradingHub.App/Localization/$language.json"
            if ($LASTEXITCODE -ne 0) { throw "Translation coverage failed: $language" }
          }
      - name: Exercise Windows UI, safety and quit scenarios
        shell: pwsh
        run: |
          $tool = 'tools/TradingHub.UiSnapshot/bin/Release/net10.0/TradingHub.UiSnapshot.dll'
          $env:TRADINGHUB_LANG = 'en'
          dotnet $tool "$env:RUNNER_TEMP/tradinghub-ui/en" 2 trading settings connections data strategies accounts live english panel footprint mercado conexiones data+rithmic data+import trading+strategy theme safety
          if ($LASTEXITCODE -ne 0) { throw 'English Windows UI scenarios failed' }
          foreach ($language in 'es', 'zh-CN') {
            $env:TRADINGHUB_LANG = $language
            dotnet $tool "$env:RUNNER_TEMP/tradinghub-ui/$language" 2 trading settings connections data strategies accounts live
            if ($LASTEXITCODE -ne 0) { throw "Windows language scenarios failed: $language" }
          }
      - name: Install NSIS compiler
        run: choco install nsis --yes --no-progress
      - name: Build self-contained x64 and ARM64 installers
        shell: pwsh
        run: |
          & ./build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - name: Install, launch, capture and uninstall the native ${{ matrix.arch }} application
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'tradinghub-native'
          $install = Join-Path $fixture 'Trading Hub'
          $report = Join-Path $env:RUNNER_TEMP 'tradinghub-ui/native'
          New-Item -ItemType Directory -Force "$fixture/data", $report | Out-Null
          foreach ($pair in @{
            TRADINGHUB_DATA_DIR = 'data'; TRADINGHUB_STRATEGIES_DIR = 'strategies'
            TRADINGHUB_INDICATORS_DIR = 'indicators'; TRADINGHUB_BACKTESTS_DIR = 'backtests'
            TRADINGHUB_LIVE_DIR = 'live'; TRADINGHUB_KEYCHAIN_FILE = 'fake-keychain.json'
          }.GetEnumerator()) {
            [Environment]::SetEnvironmentVariable($pair.Key, (Join-Path $fixture $pair.Value))
          }
          '[{"Id":"sim","Kind":"Simulator","Name":"Fixture simulator","Enabled":true}]' | Set-Content "$fixture/data/connections.json" -Encoding utf8
          '{"Language":"en","KeepInMenuBar":false}' | Set-Content "$fixture/data/settings.json" -Encoding utf8
          $sentinel = Join-Path $fixture 'data/preserved-user-data.txt'
          'isolated preservation sentinel' | Set-Content $sentinel
          $before = (Get-FileHash $sentinel).Hash
          $setup = Start-Process (Resolve-Path 'dist/TradingHub-Setup-${{ matrix.arch }}.exe') -ArgumentList "/S /D=$install" -PassThru -Wait
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$install/TradingHub.exe")) { throw 'Native installation failed' }
          $app = Start-Process "$install/TradingHub.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
            } while (!$app.HasExited -and $app.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'Native main window did not open' }
            Add-Type -AssemblyName System.Drawing
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class OwnedWindowCapture {
            public const uint RenderFullContent = 2;
            [StructLayout(LayoutKind.Sequential)]
            public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool GetWindowRect(IntPtr window, out Rect rect);
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool PrintWindow(IntPtr window, IntPtr dc, uint flags);
          }
          '@
            $rect = [OwnedWindowCapture+Rect]::new()
            if (![OwnedWindowCapture]::GetWindowRect($app.MainWindowHandle, [ref]$rect)) { throw 'Native window bounds unavailable' }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -le 0 -or $height -le 0) { throw 'Native window has no drawable area' }
            $bitmap = [System.Drawing.Bitmap]::new($width, $height, [System.Drawing.Imaging.PixelFormat]::Format32bppRgb)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $dc = $graphics.GetHdc()
              try {
                # Capture only our HWND, not a desktop privacy/setup overlay; never change privacy settings.
                if (![OwnedWindowCapture]::PrintWindow($app.MainWindowHandle, $dc, [OwnedWindowCapture]::RenderFullContent)) { throw 'Native window capture failed' }
              } finally {
                $graphics.ReleaseHdc($dc)
              }
              $bitmap.Save((Join-Path $report 'windows-native.png'))
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
            if (!$app.CloseMainWindow() -or !$app.WaitForExit(15000)) { throw 'Native close did not exit safely' }
            if ($app.ExitCode -ne 0) { throw "Native application exited with $($app.ExitCode)" }
          } finally {
            # Only this owned, fake-data fixture process can be terminated after a failed smoke.
            if (!$app.HasExited) { $app.Kill($true); $app.WaitForExit() }
            $app.Dispose()
          }
          $uninstall = Start-Process "$install/Desinstalar Trading Hub.exe" -ArgumentList "/S _?=$install" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$install/TradingHub.exe")) { throw 'Native uninstall failed' }
          if ((Get-FileHash $sentinel).Hash -ne $before) { throw 'Installer or uninstall changed fixture data' }
          'Native ${{ matrix.arch }} install, GUI open/capture/close, uninstall and data preservation passed.' | Set-Content (Join-Path $report 'result.txt')
      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinghub-windows-validation-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/tradinghub-ui/
            ${{ runner.temp }}/tradinghub-results/
            dist/TradingHub-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7

  macos-build-and-tests:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Require native Apple Silicon
        run: |
          arch="$(uname -m)"
          echo "Native macOS architecture: $arch"
          test "$arch" = arm64
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Isolate all application stores
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/tradinghub-validation.XXXXXX")"
          for pair in DATA_DIR:data STRATEGIES_DIR:strategies INDICATORS_DIR:indicators BACKTESTS_DIR:backtests LIVE_DIR:live KEYCHAIN_FILE:fake-keychain.json; do
            printf 'TRADINGHUB_%s=%s/%s\n' "${pair%%:*}" "$fixture" "${pair#*:}" >> "$GITHUB_ENV"
          done
      - name: Test upstream tracker without network or notifications
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Build complete solution
        run: dotnet build TradingHub.slnx --configuration Release
      - name: Run compatibility and safety regression tests
        run: dotnet test tests/TradingHub.Tests --configuration Release --no-restore --no-build --logger "trx;LogFileName=macos.trx" --results-directory "${{ runner.temp }}/tradinghub-results"
      - name: Verify English documentation, source and historical compatibility review
        run: python3 tools/check_english_translation.py
      - name: Verify every upstream translation and template
        shell: bash
        run: |
          for language in es zh-CN; do
            dotnet tools/TradingHub.I18n/bin/Release/net10.0/TradingHub.I18n.dll coverage tools/TradingHub.I18n/provenance.json "src/TradingHub.App/Localization/$language.json"
          done
      - name: Exercise English UI, safety and quit scenarios
        shell: bash
        env:
          TRADINGHUB_LANG: en
        run: |
          dotnet tools/TradingHub.UiSnapshot/bin/Release/net10.0/TradingHub.UiSnapshot.dll \
            "$RUNNER_TEMP/tradinghub-ui/en" 2 \
            trading settings connections data strategies accounts live english \
            panel footprint mercado conexiones data+rithmic data+import trading+strategy theme safety
      - name: Exercise Spanish and Simplified Chinese surfaces
        shell: bash
        run: |
          for language in es zh-CN; do
            TRADINGHUB_LANG="$language" dotnet tools/TradingHub.UiSnapshot/bin/Release/net10.0/TradingHub.UiSnapshot.dll \
              "$RUNNER_TEMP/tradinghub-ui/$language" 2 trading settings connections data strategies accounts live
          done
      - name: Upload macOS validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinghub-macos-validation
          path: |
            ${{ runner.temp }}/tradinghub-ui/
            ${{ runner.temp }}/tradinghub-results/
          if-no-files-found: warn
          retention-days: 7
